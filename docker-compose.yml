services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: galactic_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - galactic-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d galactic_marketplace"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  galactic-data:
